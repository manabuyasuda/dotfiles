# Codex ユーザー設定（dotfiles）。
# [projects.*]、[hooks.state.*]、[tui.model_availability_nux] は Codex が ~/.codex/config.toml に書き込むため、
# setup.sh の merge-codex-config.sh がローカル状態を保持してマージします。

# model と model_reasoning_effort はここに書かない。TUI の /model は選んだ値を
# ~/.codex/config.toml へ保存するため、ここに書くと切り替えるたびに実ファイルと食い違う。
# 起動時の既定（gpt-6.1-sol / high）は zsh/.zshrc の codex 関数が -m / -c で指定する。
model_verbosity = "low"
model_reasoning_summary = "concise"

[tui]
status_line = [
  "model-with-reasoning",
  "context-used",
  "five-hour-limit",
  "weekly-limit",
  "git-branch",
]
status_line_use_colors = true

[mcp_servers.figma]
url = "https://mcp.figma.com/mcp"
